<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DaTino – Eintrag bearbeiten</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#F0F4F8}
.header{background:#1A3A5C;color:#fff;padding:14px 0}
.btn-primary{background:#1A3A5C;border-color:#1A3A5C}
</style>
</head>
<body>
<div class="header">
  <div class="container">
    <h5 class="mb-0">✏️ Eintrag bearbeiten</h5>
  </div>
</div>
<div class="container mt-4" style="max-width:540px">
  <div class="card p-4">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Name</label>
        <select name="name" class="form-select" required>
          {% for m in mitarbeiter %}
          <option value="{{ m }}" {% if m==e.name %}selected{% endif %}>{{ m }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Datum</label>
        <input type="date" name="datum" class="form-control" value="{{ e.datum }}" required>
      </div>
      <div class="row g-2 mb-3">
        <div class="col">
          <label class="form-label fw-semibold">Beginn</label>
          <input type="time" name="beginn" class="form-control" value="{{ e.beginn }}" required>
        </div>
        <div class="col">
          <label class="form-label fw-semibold">Ende</label>
          <input type="time" name="ende" class="form-control" value="{{ e.ende }}" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Pause (Minuten)</label>
        <input type="number" name="pause_min" class="form-control" value="{{ e.pause_min }}" min="0">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Bemerkungen</label>
        <input type="text" name="bemerkungen" class="form-control" value="{{ e.bemerkungen or '' }}">
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary flex-grow-1">💾 Speichern</button>
        <a href="javascript:history.back()" class="btn btn-secondary">Abbrechen</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>

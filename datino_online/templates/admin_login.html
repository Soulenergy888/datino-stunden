<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DaTino Admin – Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#F0F4F8;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.12);max-width:380px;width:100%}
.btn-dark-blue{background:#1A3A5C;color:#fff;border:none}
.btn-dark-blue:hover{background:#2E6DA4;color:#fff}
</style>
</head>
<body>
<div class="card p-4">
  <div class="text-center mb-4">
    <div style="font-size:2.5rem">🍽️</div>
    <h4 style="color:#1A3A5C">DaTino Admin</h4>
    <div class="text-muted small">Manager-Bereich</div>
  </div>
  {% with msgs = get_flashed_messages() %}
    {% if msgs %}
    <div class="alert alert-danger py-2">{{ msgs[0] }}</div>
    {% endif %}
  {% endwith %}
  <form method="POST">
    <div class="mb-3">
      <label class="form-label fw-semibold">Passwort</label>
      <input type="password" name="password" class="form-control" autofocus required>
    </div>
    <button type="submit" class="btn btn-dark-blue w-100 fw-bold">Anmelden</button>
  </form>
</div>
</body>
</html>
